<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ One Touch League</title>
    <style>
        body {
            background-color: #121824;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 20px;
            margin: 0;
        }

        /* Fixed normal mouse cursor remains functional */
        * {
            cursor: auto !important;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            background: #e11d48;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        h1 { margin: 0; font-size: 2rem; }
        
        .box {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #334155;
        }

        h3 {
            margin-top: 0;
            color: #38bdf8;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        select, input {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            border-radius: 6px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            width: 100%;
            text-transform: uppercase;
        }

        .player-card {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            border: 1px solid #334155;
        }

        .player-name {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .wins-badge {
            background: #4ade80;
            color: #0f172a;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .joke-text {
            position: absolute;
            background: #fef08a;
            color: #000;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            top: -25px;
            left: 20px;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            white-space: nowrap;
            z-index: 5;
        }

        .player-card:hover { border-color: #fef08a; }
        .player-card:hover .joke-text { display: block; }
        .flex-group { display: flex; gap: 10px; }
        
        .score-controls {
            display: none; /* Hidden until someone logs in successfully! */
            gap: 5px;
        }
        .score-controls button {
            padding: 5px 10px;
            width: auto;
        }

        .unlocked .score-controls {
            display: flex !important;
        }

        #loginStatus {
            margin-top: -5px;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 0.9rem;
        }
    </style>

    <!-- Connect Core Firebase Modules -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, onValue, set } from "https://gstatic.com";

        // ⚠️ STEP 4: REPLACE THIS CONFIG WITH YOUR EXACT COPIED CODES FROM FIREBASE!
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_://firebaseapp.com",
            databaseURL: "https://YOUR_://firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_://appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef123456"
        };

        // Boot up Firebase connections
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const scoresRef = ref(db, 'league/scores');

        // Initial default starting points for your full friend crew
        const initialFriends = {
            "daniel": 49, "aksuman": 47, "jashth": 22, "aarav": 18, 
            "thanish": 16, "peuish": 9, "tawan": 7, "mahi": 4, 
            "manar": 3, "danush": 2, "sathvik": 1, "krithik": 1, "muhamed": 1
        };

        // Track who is logged in globally
        let isLoggedIn = false;

        // Password matching rule logic
        window.checkLogin = function() {
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('passInput').value;
            const statusText = document.getElementById('loginStatus');
            const boardContainer = document.getElementById('leaderboardContent');

            if (user === 'aarav' && pass === '0105') {
                statusText.innerText = "✅ Unlocked: Welcome Back Aarav!";
                statusText.style.color = "#4ade80";
                boardContainer.classList.add('unlocked');
                isLoggedIn = true;
            } else if (user !== 'aarav' && pass === '1234') {
                statusText.innerText = `✅ Unlocked: Logged in as ${user.toUpperCase()}!`;
                statusText.style.color = "#4ade80";
                boardContainer.classList.add('unlocked');
                isLoggedIn = true;
            } else {
                statusText.innerText = "❌ Incorrect Password! Try again.";
                statusText.style.color = "#ef4444";
                boardContainer.classList.remove('unlocked');
                isLoggedIn = false;
            }
        };

        // Realtime Listener: Draws and re-orders the board live
        onValue(scoresRef, (snapshot) => {
            const data = snapshot.val();
            
            if (!data) {
                set(scoresRef, initialFriends);
                return;
            }

            const sortedArray = Object.keys(data).map(name => ({
                name: name,
                wins: data[name]
            })).sort((a, b) => b.wins - a.wins);

            const board = document.getElementById('leaderboardContent');
            board.innerHTML = '';

            sortedArray.forEach((player, index) => {
                const prefix = index === 0 ? "🥇 " : index === 1 ? "🥈 " : index === 2 ? "🥉 " : "🏃 ";
                const isAarav = player.name.toLowerCase() === 'aarav';
                const customJoke = isAarav ? "👑 The Undisputed Leader!" : "😜 Aarav is better than u and u and u!";

                const cardHtml = `
                    <div class="player-card">
                        <div class="joke-text">${customJoke}</div>
                        <div class="player-name">${prefix} ${player.name.toUpperCase()}</div>
                        <div style="display:flex; align-items:center; gap:15px;">
                            <div class="wins-badge">${player.wins} Wins</div>
                            <div class="score-controls">
                                <button style="background:#22c55e;" onclick="updateWins('${player.name}', 1)">+</button>
                                <button style="background:#ef4444; color:white;" onclick="updateWins('${player.name}', -1)">-</button>
                            </div>
                        </div>
                    </div>
                `;
                board.innerHTML += cardHtml;
            });
        });

        // Handler to push changes to Firebase database
        window.updateWins = function(playerName, adjustment) {
            if(!isLoggedIn) return; // Block changes if not validated
            onValue(ref(db, `league/scores/${playerName}`), (snap) => {
                const current = snap.val() || 0;
                const newScore = Math.max(0, current + adjustment);
                set(ref(db, `league/scores/${playerName}`), newScore);
            }, { onlyOnce: true });
        }
    </script>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚽ One Touch League</h1>
            <p style="margin: 5px 0 0 0; color: #fef08a; font-weight: bold;">⚡ REAL-TIME LIVE SCOREBOARD ⚡</p>
        </header>

        <!-- Live Score Tracking Box -->
        <div class="box">
            <h3>🏆 Leaderboard Standings (Race to 50 Wins)</h3>
            <div id="leaderboardContent">
                <p style="padding:15px; color:#94a3b8;">Connecting to Realtime Cloud database...</p>
            </div>
        </div>

        <!-- Protected Login Layout -->
        <div class="box">
            <h3>🔒 Protected Login</h3>
            <div id="loginStatus">🔐 Status: Locked (Log in to update scores)</div>
            
            <label style="display:block; margin-bottom:5px; font-weight:bold;">Select Your Name:</label>
