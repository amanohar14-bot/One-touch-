<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ One Touch League</title>
    <style>
        body {
            background-color: #121824;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 20px;
            margin: 0;
        }

        /* CURSOR FIXED: This ensures your normal mouse cursor stays visible! */
        * {
            cursor: auto !important;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            background: #e11d48;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        h1 { margin: 0; font-size: 2rem; }
        
        .box {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #334155;
        }

        h3 {
            margin-top: 0;
            color: #38bdf8;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        /* Inputs & Dropdowns */
        select, input {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            border-radius: 6px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            width: 100%;
            text-transform: uppercase;
        }

        /* Leaderboard Styling Fix */
        .player-card {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            border: 1px solid #334155;
        }

        .player-name {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .wins-badge {
            background: #4ade80;
            color: #0f172a;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        /* Fun Hover Jokes */
        .joke-text {
            position: absolute;
            background: #fef08a;
            color: #000;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            top: -25px;
            left: 20px;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            white-space: nowrap;
        }

        .player-card:hover {
            border-color: #fef08a;
        }

        .player-card:hover .joke-text {
            display: block;
        }

        .flex-group {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚽ One Touch League</h1>
            <p style="margin: 5px 0 0 0; color: #fef08a; font-weight: bold;">Fun Arcade Edition</p>
        </header>

        <!-- Leaderboard (Put First to See it Instantly) -->
        <div class="box">
            <h3>🏆 Leaderboard Standings (Race to 50 Wins)</h3>
            
            <!-- Aarav -->
            <div class="player-card">
                <div class="joke-text">😜 Aarav is better than u and u and u!</div>
                <div class="player-name">👑 Aarav</div>
                <div class="wins-badge">42 Wins</div>
            </div>

            <!-- Krithik -->
            <div class="player-card">
                <div class="joke-text">🤫 Aarav is better than u!</div>
                <div class="player-name">🔥 Krithik</div>
                <div class="wins-badge">1 Win</div>
            </div>

            <!-- Player 3 -->
            <div class="player-card">
                <div class="joke-text">🤣 Aarav is way better than u!</div>
                <div class="player-name">👾 Player 3</div>
                <div class="wins-badge">0 Wins</div>
            </div>
        </div>

        <!-- Protected Login -->
        <div class="box">
            <h3>🔒 Protected Login</h3>
            <select>
                <option>Aarav</option>
                <option>Krithik</option>
                <option>Player 3</option>
            </select>
            <input type="password" placeholder="Enter Password">
            <button onclick="alert('Logged in!')">Login</button>
        </div>

        <!-- GitHub Sync Config -->
        <div class="box">
            <h3>👑 Host 1-Click GitHub Sync</h3>
            <input type="text" placeholder="Paste GitHub Token here (ghp_...)">
            <button style="background: #4ade80;">Save Sync Token</button>
        </div>

        <!-- Master Curses Control -->
        <div class="box">
            <h3>🪄 Master Curses Control</h3>
            <select>
                <option>Krithik</option>
                <option>Player 3</option>
            </select>
            <div class="flex-group">
                <button style="background: #ef4444; color: white;" onclick="alert('Curse Set: Forced Miss')">Forced Miss</button>
                <button style="background: #22c55e; color: white;" onclick="alert('Curse Set: Forced Goal')">Forced Goal</button>
            </div>
        </div>
    </div>

</body>
</html>
